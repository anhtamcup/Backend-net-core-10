<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Luồng chi hộ: Doidep, Retail, NAB</title>
  <desc id="description">Doidep gửi yêu cầu chi hộ cho Retail. Retail xác thực chữ ký, ký và mã hóa yêu cầu gửi NAB. NAB xác thực Retail và xử lý chi hộ. NAB gửi thông báo lại Retail, Retail chuyển tiếp cho Doidep.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="9" stdDeviation="14" flood-color="#17314e" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6.5 L1 12" fill="none" stroke="#3775ad" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-orange" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6.5 L1 12" fill="none" stroke="#e58a4a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', 'Noto Sans', Arial, sans-serif; fill: #19334c; }
      .title { font-size: 42px; font-weight: 750; letter-spacing: -0.6px; }
      .subtitle { font-size: 22px; fill: #5c7287; }
      .section { font-size: 19px; font-weight: 750; letter-spacing: 1.1px; }
      .card-title { font-size: 34px; font-weight: 750; }
      .card-copy { font-size: 23px; font-weight: 600; }
      .card-note { font-size: 21px; fill: #50657a; }
      .badge { font-size: 20px; font-weight: 750; fill: white; }
      .arrow-label { font-size: 20px; font-weight: 650; }
      .return-title { font-size: 25px; font-weight: 750; }
      .return-copy { font-size: 20px; fill: #65768a; }
      .footnote { font-size: 19px; fill: #607589; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f5f8fc"/>
  <rect x="0" y="0" width="1600" height="12" fill="#2f76a5"/>

  <text class="title" x="80" y="83">Luồng chi hộ qua Retail và NAB</text>
  <text class="subtitle" x="80" y="122">Yêu cầu đi sang NAB • Kết quả quay về Doidep</text>

  <rect x="80" y="158" width="275" height="42" rx="21" fill="#e2edf7"/>
  <text class="section" x="105" y="186" fill="#27689c">01  YÊU CẦU CHI HỘ</text>

  <!-- Doidep -->
  <g filter="url(#shadow)">
    <rect x="80" y="238" width="365" height="312" rx="24" fill="#ffffff"/>
  </g>
  <rect x="80" y="238" width="365" height="11" rx="5" fill="#7467c8"/>
  <circle cx="139" cy="299" r="28" fill="#edeafd"/>
  <circle cx="139" cy="292" r="8" fill="none" stroke="#7467c8" stroke-width="3"/>
  <path d="M122 316c2-12 31-12 34 0" fill="none" stroke="#7467c8" stroke-width="3" stroke-linecap="round"/>
  <text class="card-title" x="185" y="311">Doidep</text>
  <line x1="113" y1="341" x2="411" y2="341" stroke="#e8edf3" stroke-width="2"/>
  <circle cx="124" cy="383" r="17" fill="#7467c8"/>
  <text class="badge" x="118" y="390">1</text>
  <text class="card-copy" x="157" y="390">Gửi thông tin cần chi hộ</text>
  <text class="card-note" x="112" y="447">Ký yêu cầu bằng private key</text>
  <text class="card-note" x="112" y="478">của Doidep</text>

  <!-- Retail -->
  <g filter="url(#shadow)">
    <rect x="618" y="238" width="365" height="312" rx="24" fill="#ffffff"/>
  </g>
  <rect x="618" y="238" width="365" height="11" rx="5" fill="#168a8d"/>
  <circle cx="677" cy="299" r="28" fill="#dff5f2"/>
  <path d="M677 279l17 7v12c0 13-9 21-17 25-8-4-17-12-17-25v-12z" fill="none" stroke="#168a8d" stroke-width="3" stroke-linejoin="round"/>
  <path d="M669 299l6 6 11-13" fill="none" stroke="#168a8d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="card-title" x="724" y="311">Retail</text>
  <line x1="651" y1="341" x2="949" y2="341" stroke="#e8edf3" stroke-width="2"/>
  <circle cx="662" cy="383" r="17" fill="#168a8d"/>
  <text class="badge" x="656" y="390">2</text>
  <text class="card-copy" x="695" y="390">Xác thực chữ ký</text>
  <text class="card-note" x="650" y="422">Doidep bằng public key</text>
  <circle cx="662" cy="466" r="17" fill="#168a8d"/>
  <text class="badge" x="656" y="473">3</text>
  <text class="card-note" x="695" y="473">Ký bằng private key</text>
  <text class="card-note" x="650" y="506">Retail, mã hóa gửi NAB</text>

  <!-- NAB -->
  <g filter="url(#shadow)">
    <rect x="1155" y="238" width="365" height="312" rx="24" fill="#ffffff"/>
  </g>
  <rect x="1155" y="238" width="365" height="11" rx="5" fill="#286cb2"/>
  <circle cx="1214" cy="299" r="28" fill="#e3effc"/>
  <path d="M1197 291l17-10 17 10M1201 294v19m9-19v19m9-19v19m9-19v19m-33 3h40" fill="none" stroke="#286cb2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="card-title" x="1261" y="311">NAB</text>
  <line x1="1188" y1="341" x2="1486" y2="341" stroke="#e8edf3" stroke-width="2"/>
  <circle cx="1199" cy="383" r="17" fill="#286cb2"/>
  <text class="badge" x="1193" y="390">4</text>
  <text class="card-copy" x="1232" y="390">Xác thực Retail</text>
  <text class="card-note" x="1187" y="422">bằng public key</text>
  <circle cx="1199" cy="466" r="17" fill="#286cb2"/>
  <text class="badge" x="1193" y="473">5</text>
  <text class="card-note" x="1232" y="473">Thực hiện chi hộ</text>

  <!-- Forward arrows -->
  <path d="M465 393 H592" fill="none" stroke="#3775ad" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <text class="arrow-label" x="529" y="356" text-anchor="middle">Yêu cầu</text>
  <text class="arrow-label" x="529" y="381" text-anchor="middle">chi hộ</text>
  <path d="M1002 393 H1129" fill="none" stroke="#3775ad" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <text class="arrow-label" x="1066" y="345" text-anchor="middle">Yêu cầu đã ký</text>
  <text class="arrow-label" x="1066" y="370" text-anchor="middle">và mã hóa</text>

  <rect x="80" y="589" width="355" height="42" rx="21" fill="#fff0e4"/>
  <text class="section" x="105" y="617" fill="#bb6d31">02  THÔNG BÁO KẾT QUẢ</text>

  <!-- Return flow: right to left -->
  <rect x="80" y="683" width="365" height="102" rx="20" fill="#ffffff" stroke="#eaded4" stroke-width="2"/>
  <rect x="618" y="683" width="365" height="102" rx="20" fill="#ffffff" stroke="#eaded4" stroke-width="2"/>
  <rect x="1155" y="683" width="365" height="102" rx="20" fill="#ffffff" stroke="#eaded4" stroke-width="2"/>
  <text class="return-title" x="112" y="725">Doidep</text>
  <text class="return-copy" x="112" y="758">Nhận kết quả chi hộ</text>
  <text class="return-title" x="650" y="725">Retail</text>
  <text class="return-copy" x="650" y="758">Chuyển tiếp thông báo</text>
  <text class="return-title" x="1187" y="725">NAB</text>
  <text class="return-copy" x="1187" y="758">Đẩy thông báo kết quả</text>
  <path d="M1135 734 H1002" fill="none" stroke="#e58a4a" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <path d="M598 734 H465" fill="none" stroke="#e58a4a" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-orange)"/>

  <line x1="80" y1="824" x2="1520" y2="824" stroke="#dce5ef" stroke-width="2"/>
  <text class="footnote" x="80" y="858">Private key dùng để ký • Public key của bên gửi dùng để xác thực chữ ký</text>
</svg>
